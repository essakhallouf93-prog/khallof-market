databases:
  - name: khallof-market-db
    plan: free
    databaseName: khallof_market
    user: khallof_user
services:
  - type: web
    name: khallof-market
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: khallof-market-db
          property: connectionString
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
